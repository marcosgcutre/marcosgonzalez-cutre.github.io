<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Marcos Gonzalez-Cutre</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Marcos Gonzalez-Cutre — Artista visual.">
  <style>

    /* ── Reset ──────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Base ───────────────────────────────────────────── */
    html { scroll-behavior: smooth; }
    body {
      font-family: Georgia, "Times New Roman", serif;
      background: #fff;
      color: #111;
      line-height: 1.55;
    }

    /* ── Header fijo ────────────────────────────────────── */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 40px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border-bottom: 1px solid rgba(0,0,0,0.06);
    }

    .site-title h1 {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: .2px;
    }
    .site-title .tag {
      color: #666;
      font-size: 12px;
      margin-top: 1px;
    }

    nav a {
      margin-left: 22px;
      text-decoration: none;
      color: #111;
      font-size: 13px;
      letter-spacing: .3px;
    }
    nav a:hover { text-decoration: underline; }

    /* ── Imagen a pantalla completa ─────────────────────── */
    .obra {
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
      background: #111;
    }

    .obra img {
      width: 100%;
      height: 100%;
      object-fit: cover;       /* ocupa toda la pantalla */
      object-position: center;
      display: block;
      opacity: 0.97;
    }

    /* Caption sobre la imagen, abajo a la izquierda */
    .obra-caption {
      position: absolute;
      bottom: 36px;
      left: 44px;
      color: #fff;
      font-size: 13px;
      letter-spacing: .4px;
      text-shadow: 0 1px 6px rgba(0,0,0,0.55);
      line-height: 1.6;
    }

    /* Flecha sutil para indicar que hay más contenido */
    .scroll-hint {
      position: absolute;
      bottom: 24px;
      right: 44px;
      color: rgba(255,255,255,0.7);
      font-size: 22px;
      animation: bounce 2s infinite;
      cursor: default;
      user-select: none;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(6px); }
    }

    /* ── Footer ─────────────────────────────────────────── */
    footer {
      padding: 30px 40px;
      color: #777;
      font-size: 13px;
      text-align: center;
      border-top: 1px solid #eee;
    }

    /* ── Responsive (móvil) ─────────────────────────────── */
    @media (max-width: 640px) {
      header {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
        padding: 14px 20px;
      }
      nav a { margin-left: 0; margin-right: 14px; }
      .obra-caption { left: 20px; bottom: 26px; }
      .scroll-hint  { right: 20px; }
    }

  </style>
</head>
<body>

  <!-- ── HEADER ───────────────────────────────────────── -->
  <header>
    <div class="site-title">
      <h1>Marcos Gonzalez-Cutre</h1>
      <p class="tag">Artista visual</p>
    </div>
    <nav>
      <a href="statement.html">Statement</a>
      <a href="works.html">Obras</a>
      <a href="bio.html">Bio</a>
      <a href="cv.html">CV</a>
      <a href="exhibitions.html">Exposiciones</a>
      <a href="contact.html">Contacto</a>
    </nav>
  </header>


  <!-- ══════════════════════════════════════════════════
       OBRAS — duplicá este bloque para añadir más imágenes.
       Solo cambiá: src="./assets/NombreArchivo.jpg"
                    alt, el título y los datos de la obra.
  ══════════════════════════════════════════════════════ -->

  <section class="obra">
    <img src="./assets/Rizoma.jpeg" alt="Rizoma — Marcos Gonzalez-Cutre">
    <div class="obra-caption">
      Rizoma, 2025<br>
      Óleo sobre tela — 230 × 203 cm
    </div>
    <div class="scroll-hint">↓</div>
  </section>

  <!-- ── FOOTER ───────────────────────────────────────── -->
  <footer>

</body>
</html>
